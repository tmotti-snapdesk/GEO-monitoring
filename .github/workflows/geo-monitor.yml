name: GEO Monitor - run hebdomadaire

# Remplace l'ancien scheduler.js (node-cron) : interroge les moteurs IA sur
# les 100 prompts et écrit les résultats dans la base Turso, que le dashboard
# déployé sur Vercel lit ensuite en lecture seule.
#
# Mise en place (une seule fois) :
#  1. Crée une base Turso (voir README, section "Déploiement").
#  2. Ajoute les secrets ci-dessous dans Settings > Secrets and variables >
#     Actions du repo GitHub : TURSO_DATABASE_URL, TURSO_AUTH_TOKEN,
#     OPENAI_API_KEY, ANTHROPIC_API_KEY, SERPAPI_API_KEY, GEMINI_API_KEY.
#  3. (Optionnel) ajoute des "variables" (pas des secrets, non sensibles) pour
#     OPENAI_MODEL, ANTHROPIC_MODEL, etc. si tu veux surcharger les valeurs
#     par défaut du code de façon permanente.
#  4. Le workflow tourne automatiquement chaque lundi. Pour tester avant
#     d'attendre le prochain lundi, ou pour un run réduit (moins de moteurs /
#     moins de prompts) : onglet "Actions" du repo > ce workflow >
#     "Run workflow" — les 2 champs proposés permettent de limiter le test
#     sans toucher au code ni ajouter de variable de repo.

on:
  schedule:
    # Tous les lundis à 6h UTC. Les crons GitHub Actions sont toujours en UTC
    # (contrairement à l'ancien node-cron qui utilisait l'heure du serveur) —
    # ajuste l'heure ci-dessous si tu veux viser une heure locale précise.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      engines_enabled:
        description: 'Moteurs à tester, séparés par des virgules (ex: "claude,gemini"). Vide = tous.'
        required: false
        default: ""
      prompt_end_index:
        description: "Nombre de prompts à tester (ex: 5 pour un test rapide). Vide = 100 (tous)."
        required: false
        default: ""

jobs:
  run-monitoring:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snapdesk-geo-monitor/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run run-once
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_SENTIMENT_MODEL: ${{ vars.ANTHROPIC_SENTIMENT_MODEL }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Priorité aux champs saisis lors d'un déclenchement manuel
          # ("Run workflow"), sinon aux variables de repo permanentes.
          ENGINES_ENABLED: ${{ inputs.engines_enabled || vars.ENGINES_ENABLED }}
          PROMPT_END_INDEX: ${{ inputs.prompt_end_index || vars.PROMPT_END_INDEX }}
